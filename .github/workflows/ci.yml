name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate: required status checks must still report, so jobs are skipped
  # (which counts as passing) instead of the whole workflow being filtered.
  #
  # Which jobs run (pull requests only; pushes to master and manual runs
  # always run everything). Filters live in .github/ci-filters.yml.
  #
  #   change                          linux x3 + macos   profile jobs
  #   ------------------------------  -----------------  -------------------
  #   docs, changelog, site, scripts  skipped            skipped
  #   src/, include/, modules/, bin/, run                see the table below
  #   test/, schemas/, cmake/, ...
  #   CMake files, cmake/, workflow,  run                all four
  #   docker/builder-latest
  #
  # Profile jobs (CMakePresets.json) run when a file in their area changes.
  # Every profile also runs for build-system changes, the pregenerated-source
  # generators (src/runtime/spec, src/diagnostics) and src/unit_tests.
  #
  #   profile         what it changes                      runs when these change
  #   --------------  -----------------------------------  ----------------------------------
  #   embedded        ZORBA_NO_FULL_TEXT, _NO_XMLSCHEMA,   files with those guards: src/api,
  #                   _WITH_DEBUGGER=OFF, _WITH_THESAURUS  capi, compiler, context, functions,
  #                   =OFF, _SUPPRESS_CURL                 runtime, store, system, types,
  #                                                        include/, bin/zorbacmd*, C++ in
  #                                                        modules/, test/api|unit|driver, schema,
  #                                                        full-text and validation tests
  #   embedded-noicu  embedded + ZORBA_NO_ICU              embedded's, plus src/util,
  #                                                        zorbautils, zorbatypes,
  #                                                        zorbaserialization, regex, string,
  #                                                        collation, charset, unicode, date and
  #                                                        time tests
  #   bigint          ZORBA_WITH_BIG_INTEGER               include/, src/zorbatypes, system,
  #                                                        runtime/numerics, types, store, api,
  #                                                        test/api|unit|fots_driver, numeric,
  #                                                        integer and decimal tests
  #   full-nopch      ZORBA_USE_PCH=OFF (headers stand     include/, any src/**/*.h|hpp|tcc,
  #                   alone), _WITH_DEBUGGER=ON,           src/debugger, runtime/debug|eval|core|
  #                   ZORBA_XQUERYX=ON                     api|visitors, compiler/xqueryx|api|
  #                                                        expression|translator|codegen,
  #                                                        bin/debugger, bin/zorbacmd*, test/api|
  #                                                        unit|driver|update, .xqx tests
  #
  # scripts/check-profile-filters.sh (job "profile filters") fails when a file
  # containing a profile's guard macro is not matched by that profile's
  # patterns, so the mapping cannot rot unnoticed. Residual risk: code that
  # uses a disabled feature WITHOUT a guard, in a file outside the profile's
  # area, is only caught by the master push run.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.f.outputs.code || steps.all.outputs.code }}
      profiles: ${{ steps.profiles.outputs.list }}
      profile_filters: ${{ steps.c.outputs.profile_filters || steps.all.outputs.profile_filters }}
      os_access: ${{ steps.c.outputs.os_access || steps.all.outputs.os_access }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: .github/ci-filters.yml
      - id: all
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "code=true"
            echo "profile_filters=true"
            echo "os_access=true"
          } >> "$GITHUB_OUTPUT"
      # Inputs of the two cheap audit jobs below (not required checks, so
      # they are skipped as whole jobs).
      - id: c
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            profile_filters:
              - 'src/**'
              - 'include/**'
              - 'modules/**'
              - 'bin/**'
              - 'test/**'
              - 'schemas/**'
              - 'cmake/**'
              - 'scripts/**'
              - 'docker/**'
              - 'CMake*'
              - '*.cmake'
              - '*.cmake.in'
              - 'CTest*'
              - 'CPack*'
              - '.github/ci-filters.yml'
              - '.github/workflows/ci.yml'
            os_access:
              - 'src/**'
              - 'modules/**'
              - 'scripts/check-os-access.*'
              - '.github/workflows/ci.yml'
      - id: profiles
        env:
          EVENT: ${{ github.event_name }}
          EMBEDDED: ${{ steps.f.outputs.embedded }}
          NOICU: ${{ steps.f.outputs.embedded-noicu }}
          NOPCH: ${{ steps.f.outputs.full-nopch }}
          BIGINT: ${{ steps.f.outputs.bigint }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            list='["embedded","embedded-noicu","full-nopch","bigint"]'
          else
            list=
            [ "$EMBEDDED" = true ] && list="$list\"embedded\","
            [ "$NOICU" = true ] && list="$list\"embedded-noicu\","
            [ "$NOPCH" = true ] && list="$list\"full-nopch\","
            [ "$BIGINT" = true ] && list="$list\"bigint\","
            list="[${list%,}]"
          fi
          echo "profiles: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # Cheap: keeps .github/ci-filters.yml in step with the guard macros of the
  # profiles (see the comment above). Runs when a file it scans or its own
  # inputs change.
  profile-filters:
    name: profile filters
    needs: changes
    if: needs.changes.outputs.profile_filters == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-profile-filters.sh

  # Every call in src/ and modules/ that reaches the file system, the
  # network, the environment, native libraries or the XML parser must be in
  # the reviewed allow-list (see scripts/check-os-access.sh), so that new OS
  # access cannot bypass the security policy unnoticed.
  os-access-audit:
    name: OS access audit
    needs: changes
    if: needs.changes.outputs.os_access == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-os-access.sh

  linux:
    # Gating is per step, not per job: a skipped matrix job reports its name
    # as a literal "matrix.name", which would leave the required checks pending.
    needs: changes
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # arm64 runs on the Ubuntu 24.04 builder: Arch Linux has no official
    # arm64 image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64 (Arch, latest toolchain)
            runner: ubuntu-24.04
            builder: docker/builder-latest
            cache: linux-amd64-latest
            suffix: ''
            cc: gcc
            cxx: g++
          - name: linux-arm64 (Ubuntu 24.04)
            runner: ubuntu-24.04-arm
            builder: docker/builder
            cache: linux-arm64-ubuntu
            suffix: -arm64
            cc: gcc
            cxx: g++
          - name: linux-amd64-clang (Arch, Clang + libstdc++)
            runner: ubuntu-24.04
            builder: docker/builder-latest
            cache: linux-amd64-clang
            suffix: ''
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - name: Builder image
        uses: ./.github/actions/builder-image
        if: needs.changes.outputs.code == 'true'
        with:
          context: ${{ matrix.builder }}
          suffix: ${{ matrix.suffix }}
          cache-scope: ${{ matrix.cache }}

      # The HTTP test server image needs buildx even when the builder image
      # was pulled.
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.code == 'true'

      - name: Build the HTTP test server image
        uses: docker/build-push-action@v7
        if: needs.changes.outputs.code == 'true'
        with:
          context: .
          file: docker/http-test-server/Dockerfile
          load: true
          tags: zorba-http-test:ci
          cache-from: type=gha,scope=http-test-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=http-test-${{ matrix.cache }}

      # ccache runs in depend mode (CCACHE_DEPEND=1) in every workflow: its
      # preprocessor-mode fallback serves stale precompiled headers when only
      # a macro inside the PCH changes (see ZORBA_USE_PCH in src/CMakeLists.txt).
      # "v2" drops the caches poisoned by that fallback.
      - uses: actions/cache@v6
        if: needs.changes.outputs.code == 'true'
        with:
          path: .ccache
          key: ccache-v2-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: ccache-v2-${{ matrix.cache }}-

      - name: Build and test
        if: needs.changes.outputs.code == 'true'
        run: |
          docker network create zorba-test
          docker run -d --name zorba-http-test --network zorba-test zorba-http-test:ci
          docker run --rm --network zorba-test \
            -e ZORBA_HTTP_TEST_SERVER=zorba-http-test:8080 \
            -e CC=${{ matrix.cc }} -e CXX=${{ matrix.cxx }} \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
              cmake --preset full-release
              cmake --build --preset full-release
              ccache -s
              ctest --preset full-release -j"$(nproc)" \
                --output-junit junit.xml'

      - name: Verify hardening
        if: needs.changes.outputs.code == 'true'
        run: scripts/check-hardening.sh build/full-release

      # The checked-in parsers/scanners must be what this image's bison and
      # flex generate from parser.y/scanner.l (see
      # src/compiler/parser/CMakeLists.txt). The regenerated files are
      # uploaded as the generated-parser artifact.
      - name: Check that the generated parsers and scanners are up to date
        if: always() && needs.changes.outputs.code == 'true' && matrix.cache == 'linux-amd64-latest'
        run: |
          docker run --rm -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
            bison --version | head -1
            flex --version
            cmake -S . -B build/regen -G Ninja \
              -DCMAKE_DISABLE_FIND_PACKAGE_Java=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_JNI=ON \
              -DZORBA_REGENERATE_PARSER=ON > /dev/null
            cmake --build build/regen --target zorba_parser_sources
            sh build/regen/copyparser.sh'
          git status --short -- src/compiler/parser
          git diff --stat --exit-code -- src/compiler/parser

      - name: Upload the regenerated parsers and scanners
        if: needs.changes.outputs.code == 'true' && always() && matrix.cache == 'linux-amd64-latest'
        uses: actions/upload-artifact@v7
        with:
          name: generated-parser
          path: |
            src/compiler/parser/*_parser.cpp
            src/compiler/parser/*_parser.hpp
            src/compiler/parser/*_scanner.cpp
            src/compiler/parser/location.hh
            src/compiler/parser/FlexLexer.h

      - name: Upload test results
        if: needs.changes.outputs.code == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.cache }}
          path: |
            build/full-release/junit.xml
            build/full-release/Testing/Temporary/LastTest.log

  profiles:
    needs: changes
    if: needs.changes.outputs.profiles != '[]'
    name: profile ${{ matrix.preset }} (linux-amd64, Arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Subset of [embedded, embedded-noicu, full-nopch, bigint] chosen by
        # the changes job. bigint: ZORBA_WITH_BIG_INTEGER=ON (arbitrary-
        # precision xs:integer).
        preset: ${{ fromJSON(needs.changes.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v7

      - name: Builder image
        uses: ./.github/actions/builder-image
        with:
          context: docker/builder-latest
          cache-scope: linux-amd64-latest

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-profile-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v2-profile-${{ matrix.preset }}-

      # No HTTP test server here: the presets' test filters exclude the tests that need it.
      - name: Configure and build
        timeout-minutes: 30
        run: |
          mkdir -p build
          docker run --rm \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
              cmake --preset ${{ matrix.preset }}
              cmake --build --preset ${{ matrix.preset }} -- -k 0
              ccache -s
              scripts/profile-size.sh ${{ matrix.preset }} > build/size.md
              cat build/size.md'

      - name: Test
        timeout-minutes: 20
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              ulimit -c 0
              ctest --preset ${{ matrix.preset }} -j"$(nproc)" --timeout 60 \
                --output-junit junit.xml > build/ctest.log 2>&1
              rc=$?
              tail -n 60 build/ctest.log
              exit $rc'

      - name: Summary
        if: always()
        run: |
          {
            cat build/size.md 2>/dev/null || true
            echo
            echo '```'
            tail -n 5 build/ctest.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-profile-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/junit.xml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/ctest.log

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: macos-arm64 (Apple Clang, Homebrew)
    runs-on: macos-15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CCACHE_DEPEND: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install icu4c libxml2 xerces-c ninja ccache
          echo "CMAKE_PREFIX_PATH=$(brew --prefix icu4c):$(brew --prefix libxml2):$(brew --prefix xerces-c)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-macos-arm64-${{ github.sha }}
          restore-keys: ccache-v2-macos-arm64-

      - name: Configure
        run: >
          cmake --preset full-release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset full-release

      # macOS runners have no Docker, so the HTTP test server is unavailable.
      - name: Test
        run: >
          ctest --preset full-release-offline -j"$(sysctl -n hw.ncpu)"
          --output-junit junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos-arm64
          path: |
            build/full-release/junit.xml
            build/full-release/Testing/Temporary/LastTest.log
