name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # arm64 runs on the Ubuntu 24.04 builder: Arch Linux has no official
    # arm64 image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64 (Arch, latest toolchain)
            runner: ubuntu-24.04
            builder: docker/builder-latest
            cache: linux-amd64-latest
          - name: linux-arm64 (Ubuntu 24.04)
            runner: ubuntu-24.04-arm
            builder: docker/builder
            cache: linux-arm64-ubuntu
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the builder image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.builder }}
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.cache }}

      - name: Build the HTTP test server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/http-test-server/Dockerfile
          load: true
          tags: zorba-http-test:ci
          cache-from: type=gha,scope=http-test-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=http-test-${{ matrix.cache }}

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cache }}-

      - name: Build and test
        run: |
          docker network create zorba-test
          docker run -d --name zorba-http-test --network zorba-test zorba-http-test:ci
          docker run --rm --network zorba-test \
            -e ZORBA_HTTP_TEST_SERVER=zorba-http-test:8080 \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
              cmake --preset full-release
              cmake --build --preset full-release
              ccache -s
              ctest --preset full-release -j"$(nproc)" \
                --output-junit junit.xml'

      - name: Verify hardening
        run: scripts/check-hardening.sh build/full-release

      # The checked-in parsers/scanners must be what this image's bison and
      # flex generate from parser.y/scanner.l (see
      # src/compiler/parser/CMakeLists.txt). The regenerated files are
      # uploaded as the generated-parser artifact.
      - name: Check that the generated parsers and scanners are up to date
        if: matrix.cache == 'linux-amd64-latest'
        run: |
          docker run --rm -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
            bison --version | head -1
            flex --version
            cmake -S . -B build/regen -G Ninja \
              -DZORBA_SUPPRESS_SWIG=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_Java=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_JNI=ON \
              -DZORBA_REGENERATE_PARSER=ON > /dev/null
            cmake --build build/regen --target zorba_parser_sources
            sh build/regen/copyparser.sh'
          git status --short -- src/compiler/parser
          git diff --stat --exit-code -- src/compiler/parser

      - name: Upload the regenerated parsers and scanners
        if: always() && matrix.cache == 'linux-amd64-latest'
        uses: actions/upload-artifact@v4
        with:
          name: generated-parser
          path: |
            src/compiler/parser/*_parser.cpp
            src/compiler/parser/*_parser.hpp
            src/compiler/parser/*_scanner.cpp
            src/compiler/parser/location.hh
            src/compiler/parser/FlexLexer.h

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.cache }}
          path: |
            build/full-release/junit.xml
            build/full-release/Testing/Temporary/LastTest.log

  macos:
    name: macos-arm64 (Apple Clang, Homebrew)
    runs-on: macos-15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install icu4c libxml2 xerces-c ninja ccache
          echo "CMAKE_PREFIX_PATH=$(brew --prefix icu4c):$(brew --prefix libxml2):$(brew --prefix xerces-c)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: ccache-macos-arm64-

      - name: Configure
        run: >
          cmake --preset full-release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset full-release

      # macOS runners have no Docker, so the HTTP test server is unavailable.
      - name: Test
        run: >
          ctest --preset full-release-offline -j"$(sysctl -n hw.ncpu)"
          --output-junit junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos-arm64
          path: |
            build/full-release/junit.xml
            build/full-release/Testing/Temporary/LastTest.log
