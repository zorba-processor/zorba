name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # arm64 runs on the Ubuntu 24.04 builder: Arch Linux has no official
    # arm64 image.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64 (Arch, latest toolchain)
            runner: ubuntu-24.04
            builder: docker/builder-latest
            cache: linux-amd64-latest
            cc: gcc
            cxx: g++
          - name: linux-arm64 (Ubuntu 24.04)
            runner: ubuntu-24.04-arm
            builder: docker/builder
            cache: linux-arm64-ubuntu
            cc: gcc
            cxx: g++
          - name: linux-amd64-clang (Arch, Clang + libstdc++)
            runner: ubuntu-24.04
            builder: docker/builder-latest
            cache: linux-amd64-clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the builder image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.builder }}
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.cache }}

      - name: Build the HTTP test server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/http-test-server/Dockerfile
          load: true
          tags: zorba-http-test:ci
          cache-from: type=gha,scope=http-test-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=http-test-${{ matrix.cache }}

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.cache }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.cache }}-

      - name: Build and test
        run: |
          docker network create zorba-test
          docker run -d --name zorba-http-test --network zorba-test zorba-http-test:ci
          docker run --rm --network zorba-test \
            -e ZORBA_HTTP_TEST_SERVER=zorba-http-test:8080 \
            -e CC=${{ matrix.cc }} -e CXX=${{ matrix.cxx }} \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
              cmake --preset full-release
              cmake --build --preset full-release
              ccache -s
              ctest --preset full-release -j"$(nproc)" \
                --output-junit junit.xml'

      - name: Verify hardening
        run: scripts/check-hardening.sh build/full-release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.cache }}
          path: |
            build/full-release/junit.xml
            build/full-release/Testing/Temporary/LastTest.log

  profiles:
    name: profile ${{ matrix.preset }} (linux-amd64, Arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset: [embedded, embedded-noicu, full-nopch]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the builder image
        uses: docker/build-push-action@v6
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-profile-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-profile-${{ matrix.preset }}-

      # No HTTP test server here: the presets' test filters exclude the tests that need it.
      - name: Configure and build
        timeout-minutes: 30
        run: |
          mkdir -p build
          docker run --rm \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
              cmake --preset ${{ matrix.preset }}
              cmake --build --preset ${{ matrix.preset }} -- -k 0
              ccache -s
              scripts/profile-size.sh ${{ matrix.preset }} > build/size.md
              cat build/size.md'

      - name: Test
        timeout-minutes: 20
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              ulimit -c 0
              ctest --preset ${{ matrix.preset }} -j"$(nproc)" --timeout 60 \
                --output-junit junit.xml > build/ctest.log 2>&1
              rc=$?
              tail -n 60 build/ctest.log
              exit $rc'

      - name: Summary
        if: always()
        run: |
          {
            cat build/size.md 2>/dev/null || true
            echo
            echo '```'
            tail -n 5 build/ctest.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-profile-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/junit.xml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/ctest.log

  macos:
    name: macos-arm64 (Apple Clang, Homebrew)
    runs-on: macos-15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SLOPPINESS: pch_defines,time_macros
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install icu4c libxml2 xerces-c ninja ccache
          echo "CMAKE_PREFIX_PATH=$(brew --prefix icu4c):$(brew --prefix libxml2):$(brew --prefix xerces-c)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-arm64-${{ github.sha }}
          restore-keys: ccache-macos-arm64-

      - name: Configure
        run: >
          cmake --preset full-release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset full-release

      # macOS runners have no Docker, so the HTTP test server is unavailable.
      - name: Test
        run: >
          ctest --preset full-release-offline -j"$(sysctl -n hw.ncpu)"
          --output-junit junit.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos-arm64
          path: |
            build/full-release/junit.xml
            build/full-release/Testing/Temporary/LastTest.log
