# TEMPORARY: profile QT3 app-Demos/raytracer. Removed before the PR.
name: raytracer perf (temporary)

on:
  workflow_dispatch:
  push:
    branches: [qt3-raytracer-perf]
    paths: ['.github/workflows/raytracer-perf.yml']

env:
  QT3_COMMIT: 201a6e466940cdfc727f4babfedcde5332b9f578

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: head-full
            ref: ''
            cmake: cmake --preset full-release && cmake --build --preset full-release
            bin: build/full-release/bin/zorba
            tdir: build/full-release
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: src

      - uses: docker/setup-buildx-action@v4
      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: tools/docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest

      - uses: actions/cache@v6
        with:
          path: src/.ccache
          key: ccache-v2-rtperf-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-rtperf-${{ matrix.name }}-
            ccache-v2-qt3-
            ccache-v2-linux-amd64-latest-

      - name: Fetch app/Demos
        run: |
          mkdir qt3
          curl -fsSL "https://codeload.github.com/w3c/qt3tests/tar.gz/$QT3_COMMIT" \
            | tar xz --strip-components=1 -C qt3 "qt3tests-$QT3_COMMIT/app/Demos"
          d=qt3/app/Demos
          # Location hints instead of URI resolution (module prefix == file name).
          sed -i -E 's|import module namespace ([a-z]+)="(http://www.xqsharp.com/raytracer[a-z/]*)";|import module namespace \1="\2" at "\1.xq";|' $d/*.xq
          for n in 64 48 32 24 16; do
            cat > $d/rt$n.xq <<EOF
          import module namespace raytracer="http://www.xqsharp.com/raytracer" at "raytracer.xq";
          import module namespace scene="http://www.xqsharp.com/raytracer/scene" at "scene.xq";
          declare variable \$width := $n;
          declare variable \$height := $n;
          declare variable \$input-context := doc("scene.xml");
          declare variable \$scene := scene:prepare-scene(\$input-context/scene);
          string-join( ( "P3", string-join((string(\$width), string(\$height)), " "), "255",
          let \$aspect-ratio := \$width div \$height
          for \$y in 1 to \$height
          let \$y-recentered := ((-\$y div \$height) + 0.5)
          for \$x in 1 to \$width
          let \$x-recentered := ((\$x div \$width) - 0.5) * \$aspect-ratio
          return string-join( for \$channel in raytracer:plot-pixel(\$scene, \$x-recentered, \$y-recentered)
                              return string(floor(\$channel * 255)), " ") ), "&#xA;" )
          EOF
          done
          grep -h "import module" $d/*.xq

      - name: Build
        run: |
          docker run --rm -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD/src":/src -w /src zorba-builder:ci sh -ec '${{ matrix.cmake }}; ccache -s; ctest --test-dir ${{ matrix.tdir }} -R "libunit/numeric_hash" -V | tail -15'

      - name: Time and profile
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD/src":/src -v "$PWD/qt3":/qt3 -v "$PWD/out":/out -w /qt3/app/Demos \
            zorba-builder:ci sh -ec '
              pacman -Sy --noconfirm --needed perf valgrind time >/dev/null
              Z=/src/${{ matrix.bin }}
              for n in 16 24 32 48 64; do
                /usr/bin/time -f "size=$n wall=%es user=%Us maxrss=%MkB" \
                  $Z -f -q rt$n.xq -o /out/rt$n.txt 2>&1 | tail -1 | tee -a /out/times.txt
              done
              tail -c 60 /out/rt64.txt; echo
              perf record -F 499 -g --call-graph dwarf,32768 -o /out/perf.data $Z -f -q rt48.xq -o /dev/null 2>&1 | tail -1
              perf report -i /out/perf.data --no-children --percent-limit 0.5 --stdio -g none > /out/self48.txt 2>/dev/null
              perf report -i /out/perf.data --children --percent-limit 1 --stdio -g none > /out/children48.txt 2>/dev/null
              rm -f /out/perf.data
              chmod -R a+rw /out'
          { echo '```'; cat out/times.txt; head -40 out/self48.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-${{ matrix.name }}
          path: out
