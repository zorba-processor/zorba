name: ClusterFuzzLite PR fuzzing

# Fuzz the libFuzzer targets in test/fuzz for 10 minutes on every PR
# (code-change mode: only targets affected by the change). The corpus from
# the batch workflow is reused through the default GitHub artifacts store.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'modules/**'
      - 'bin/**'
      - 'test/**'
      - 'swig/**'
      - 'schemas/**'
      - 'config/**'
      - 'cmake/**'
      - 'cmake_modules/**'
      - 'docker/**'
      - '.clusterfuzzlite/**'
      - '.github/codeql/**'
      - 'CMakeLists.txt'
      - 'CMake*.txt'
      - 'CMake*.json'
      - '*.cmake'
      - '*.cmake.in'
      - 'CTest*'
      - 'CPack*'
      - '.github/workflows/cflite_pr.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  PR:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
