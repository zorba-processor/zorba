name: ClusterFuzzLite PR fuzzing

# Fuzz the libFuzzer targets in test/fuzz for 10 minutes on every PR
# (code-change mode: only targets affected by the change). The corpus from
# the batch workflow is reused through the default GitHub artifacts store.
on:
  pull_request:
    # The ClusterFuzzLite image copies the repository and builds the `fuzzers`
    # target (libzorba without Xerces/curl, and test/fuzz); code-change mode
    # fuzzes the targets the diff affects. Consumed: core C++ sources, CMake
    # files, test/fuzz (targets, dictionaries, regression inputs, seed
    # script) and the seed corpora's source files under test/rbkt.
    paths:
      - 'src/**'
      - 'include/**'
      - 'modules/**/*.c'
      - 'modules/**/*.cpp'
      - 'modules/**/*.h'
      - 'modules/**/*.hpp'
      - 'test/fuzz/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.cmake.in'
      - 'CMake*.txt'
      - 'CMake*.json'
      - 'CTest*'
      - 'CPack*'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  PR:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
