name: jwin temporary
# Temporary, for the branch jsoniq-windows only: runs the window tests and
# the window measurements on one runner. Removed before the branch is finished.
on:
  push:
    branches: [jsoniq-windows]
permissions:
  contents: read
jobs:
  tests:
    if: "!contains(github.event.head_commit.message, 'jwin-bench')"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Builder image
        uses: ./.github/actions/builder-image
        with:
          context: docker/builder-latest
          cache-scope: linux-amd64-latest
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-linux-amd64-latest-jwin-${{ github.sha }}
          restore-keys: |
            ccache-v2-linux-amd64-latest-jwin-
            ccache-v2-linux-amd64-latest-
      - name: Build and run the window tests
        run: |
          mkdir -p .ccache out
          docker run --rm \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              cmake --preset full-release > /dev/null
              cmake --build --preset full-release > out/build.log 2>&1 || { tail -50 out/build.log; exit 1; }
              ctest --test-dir build/full-release -j"$(nproc)" -R "jsoniq-windows|bin/mcp/windows|zorba/windowing|optim/hoist_window" > out/ctest.log 2>&1
              rc=$?
              tail -n 3 out/ctest.log
              cp build/full-release/Testing/Temporary/LastTest.log out/
              cp -r build/full-release/test/rbkt/QueryResults/zorba/jsoniq-windows out/results
              exit $rc'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jwin-out
          path: out/
  bench:
    if: "contains(github.event.head_commit.message, 'jwin-bench')"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - name: Builder image
        uses: ./.github/actions/builder-image
        with:
          context: docker/builder-latest
          cache-scope: linux-amd64-latest
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-linux-amd64-latest-jwin-${{ github.sha }}
          restore-keys: |
            ccache-v2-linux-amd64-latest-jwin-
            ccache-v2-linux-amd64-latest-
      - name: Build
        run: |
          mkdir -p .ccache out
          docker run --rm \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
              cmake --preset full-release > /dev/null
              cmake --build --preset full-release > out/build.log 2>&1
              c++ -std=c++23 -O2 -Wall -Wextra -Werror -o build/dirbench bench/directory/dirbench.cpp'
      - name: Measure
        timeout-minutes: 320
        env:
          SIZES: "1000 10000"
          RUNS: "1"
        run: |
          free -m
          docker run --rm -e SIZES -e RUNS -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
            ZORBA=$(find build/full-release/bin -maxdepth 1 -name zorba -type f | head -n 1)
            bench/windows/run.sh "/src/$ZORBA" /src/build/dirbench /tmp/jwin /src/out'
          cat out/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jwin-bench
          path: out/
