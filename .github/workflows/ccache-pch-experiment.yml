name: ccache PCH experiment (throwaway)
on:
  push:
    branches: [ccache-pch-experiment]
permissions:
  contents: read
jobs:
  repro:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            sloppy: pch_defines,time_macros
            extra: ""
          - variant: depend
            sloppy: pch_defines,time_macros
            extra: ""
            depend: "1"
          - variant: depend-nopch
            sloppy: pch_defines,time_macros
            extra: "-DZORBA_USE_PCH=OFF"
            depend: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
      - name: Repro
        run: |
          docker run --rm -e SLOPPY='${{ matrix.sloppy }}' -e EXTRA='${{ matrix.extra }}' \
            -e NODIRECT='${{ matrix.nodirect }}' -e DEPEND='${{ matrix.depend }}' -v "$PWD":/src -w /src zorba-builder:ci \
            sh scripts/ccache-pch/repro.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repro-${{ matrix.variant }}
          path: out/
