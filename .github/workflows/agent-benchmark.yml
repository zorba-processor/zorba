# Agent benchmark (bench/agents): zorba-mcp tools (A) versus a bash sandbox
# (B), same model, same tasks, same snapshot. See bench/agents/README.md.
#
#   pull_request (bench/agents/**, this file): build zorba, check that the
#     JSONiq ground-truth queries agree with the Python reference on every
#     task, check that the pinned Claude Code accepts the harness's command
#     line, and run the harness with its scripted model (--dry-run) for both
#     backends and both configurations. Needs no credentials. Not a required
#     check.
#   workflow_dispatch: the real benchmark with the chosen backend. The person
#     who runs it supplies their own credentials as a repository secret:
#     ANTHROPIC_API_KEY for the api backend, CLAUDE_CODE_OAUTH_TOKEN (from
#     `claude setup-token`) for the claude-code backend. Results are uploaded
#     as the agent-benchmark-results artifact.
name: Agent benchmark

on:
  pull_request:
    paths:
      - bench/agents/**
      - .github/workflows/agent-benchmark.yml
  workflow_dispatch:
    inputs:
      backend:
        description: "Backend: claude-code (claude -p, secret CLAUDE_CODE_OAUTH_TOKEN) or api (Anthropic SDK, secret ANTHROPIC_API_KEY)"
        type: choice
        options: [claude-code, api]
        default: claude-code
      model:
        description: Model id
        required: false
        default: claude-sonnet-5-5
      runs:
        description: Runs per task and configuration
        required: false
        default: "3"
      config:
        description: Configurations
        type: choice
        options: [both, A, B]
        default: both
      tasks:
        description: Comma-separated task ids or prefixes (empty = all)
        required: false
        default: ""

concurrency:
  group: agent-benchmark-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ github.event_name == 'workflow_dispatch' && format('benchmark ({0})', inputs.backend) || 'ground truth and dry run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 340 || 90 }}
    env:
      # Exact Claude Code release used by the claude-code backend (npm
      # @anthropic-ai/claude-code), on the host (A) and in the sandbox (B).
      CLAUDE_CODE_VERSION: 2.1.302
      BACKEND: ${{ inputs.backend || 'claude-code' }}
      MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
      RUNS: ${{ inputs.runs || '3' }}
      CONFIG: ${{ inputs.config || 'both' }}
      TASKS: ${{ inputs.tasks }}
    steps:
      - name: Require the credentials of the chosen backend
        if: github.event_name == 'workflow_dispatch'
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$BACKEND" = api ] && [ "$HAS_API_KEY" != true ]; then
            echo "::error::The api backend needs the repository secret ANTHROPIC_API_KEY (your own Anthropic API key); it is not set."
            exit 1
          fi
          if [ "$BACKEND" = claude-code ] && [ "$HAS_OAUTH_TOKEN" != true ]; then
            echo "::error::The claude-code backend needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (run 'claude setup-token' and store its output); it is not set."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Harness self-tests and reference freshness
        run: |
          python3 -I -m unittest discover -s bench/agents -p 'test_*.py' -v
          python3 -I bench/agents/reference.py --check

      - name: Builder image
        uses: ./.github/actions/builder-image
        with:
          context: docker/builder-latest
          cache-scope: linux-amd64-latest

      # Restore only: this workflow reuses the CI build cache without adding
      # entries of its own.
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-v2-linux-amd64-latest-${{ github.sha }}
          restore-keys: ccache-v2-linux-amd64-latest-

      - name: Build zorba
        run: |
          mkdir -p .ccache
          docker run --rm \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -ec '
              cmake --preset full-release
              cmake --build --preset full-release
              ccache -s'

      - name: Ground truth (JSONiq queries == Python reference)
        run: |
          docker run --rm -v "$PWD":/src -w /src zorba-builder:ci \
            python3 -I bench/agents/check_truth.py \
              --zorba build/full-release/bin/zorba

      - name: Build the sandbox images (configuration B)
        run: |
          docker build --target sandbox \
            -t zorba-agent-sandbox:latest bench/agents/sandbox
          docker build --target sandbox-claude \
            --build-arg CLAUDE_CODE_VERSION="$CLAUDE_CODE_VERSION" \
            -t zorba-agent-sandbox-claude:latest bench/agents/sandbox

      - name: Check the Claude Code command line
        if: github.event_name == 'pull_request'
        run: python3 -I bench/agents/harness.py --backend claude-code --check-cli

      - name: Install the Anthropic SDK
        if: github.event_name == 'workflow_dispatch' && env.BACKEND == 'api'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r bench/agents/requirements.txt

      - uses: actions/setup-node@v7
        if: github.event_name == 'workflow_dispatch' && env.BACKEND == 'claude-code'
        with:
          node-version: 24

      - name: Install Claude Code
        if: github.event_name == 'workflow_dispatch' && env.BACKEND == 'claude-code'
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Run the harness
        env:
          # Each secret reaches only the backend that uses it.
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.backend == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.backend == 'claude-code' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: |
          # zorba-mcp runs in the builder image (its libraries are there),
          # with the snapshot read-only and no network.
          mcp="docker run -i --rm --network none -v $PWD:/src:ro"
          mcp="$mcp -v $PWD/bench/agents/data/snapshot:/data:ro"
          mcp="$mcp zorba-builder:ci /src/build/full-release/bin/zorba-mcp --root /data"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python=python3
            if [ "$BACKEND" = api ]; then python=.venv/bin/python; fi
            "$python" -I bench/agents/harness.py --backend "$BACKEND" \
              --model "$MODEL" --runs "$RUNS" --config "$CONFIG" \
              --tasks "$TASKS" --mcp-command "$mcp" --out agent-results
          else
            for backend in api claude-code; do
              python3 -I bench/agents/harness.py --backend "$backend" \
                --dry-run --config both --mcp-command "$mcp" \
                --out "agent-results/$backend"
            done
          fi

      - name: Job summary
        if: always()
        run: |
          if [ -d agent-results ]; then
            find agent-results -name summary.md | sort |
              while read -r f; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && 'agent-benchmark-results' || 'agent-benchmark-dry-run' }}
          path: agent-results/
          if-no-files-found: ignore
