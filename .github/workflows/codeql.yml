name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'modules/**'
      - 'bin/**'
      - 'test/**'
      - 'schemas/**'
      - 'config/**'
      - 'cmake/**'
      - 'cmake_modules/**'
      - 'docker/**'
      - '.clusterfuzzlite/**'
      - '.github/codeql/**'
      - 'CMakeLists.txt'
      - 'CMake*.txt'
      - 'CMake*.json'
      - '*.cmake'
      - '*.cmake.in'
      - 'CTest*'
      - 'CPack*'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Same package set as docker/builder/Dockerfile (Ubuntu 24.04). CodeQL has
      # to observe the compiler, so the build runs directly on the runner.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config bison flex \
            libicu-dev libxml2-dev libxslt1-dev libcurl4-openssl-dev zlib1g-dev \
            libxerces-c-dev uuid-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # Build only the library, zorbacmd and the module libraries. The default
      # "all" target also compiles test/ (drivers, unit tests, extern test
      # functions), which only adds path-injection alerts on test code that
      # opens files named on its own command line. There is no CMake switch
      # that skips test/driver, so name the targets explicitly.
      - name: Build
        run: |
          cmake --preset full-release
          modules=$(ninja -C build/full-release -t targets all \
                    | sed -nE 's/^(modlib[0-9]+_[A-Za-z0-9_]+):.*/\1/p')
          cmake --build --preset full-release \
            --target zorba_simplestore zorbacmd $modules

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
          upload: failure-only
          output: sarif-results

      # paths-ignore does not filter results for compiled languages: files
      # CMake generates under build/ (test drivers, doc examples) are compiled
      # and analyzed like any other source. Drop their results before upload.
      #
      # Also drop results in the vendored MAPM big-number library
      # (src/zorbatypes/mapm/). Its 3 cpp/invalid-pointer-deref alerts are
      # false positives in Ooura FFT loops (`j < n; j += 16` with n a power of
      # two >= 16, arrays sized n(+8)); the code is third-party and unmodified.
      # Only MAPM is filtered: src/ compiler code and all other first-party
      # code stay in scope.
      - name: Drop results in generated build-tree files and third-party MAPM
        run: |
          for f in sarif-results/*.sarif; do
            jq '.runs[].results |= map(select(
                  (.locations[0].physicalLocation.artifactLocation.uri // "")
                  | (startswith("build/") or startswith("src/zorbatypes/mapm/"))
                  | not))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results
          category: /language:c-cpp
