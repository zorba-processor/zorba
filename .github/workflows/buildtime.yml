name: Build time measurement

# Manual: gh workflow run buildtime.yml --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        job: [gcc-ninja, gcc-nopch, warm-ccache, warm-nopch, clang-trace]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the builder image
        uses: docker/build-push-action@v6
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - name: Build the HTTP test server image
        if: matrix.job == 'gcc-ninja' || matrix.job == 'gcc-nopch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/http-test-server/Dockerfile
          load: true
          tags: zorba-http-test:ci
          cache-from: type=gha,scope=http-test-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=http-test-linux-amd64-latest

      - name: Measure
        run: |
          case "${{ matrix.job }}" in
            gcc-ninja)   mode=gcc;   pch=ON ;;
            gcc-nopch)   mode=gcc;   pch=OFF ;;
            clang-trace) mode=clang; pch=ON ;;
            warm-ccache) mode=warm;  pch=ON ;;
            warm-nopch)  mode=warm;  pch=OFF ;;
          esac
          docker network create zorba-test
          docker run -d --name zorba-http-test --network zorba-test zorba-http-test:ci || true
          docker run --rm --network zorba-test \
            -e ZORBA_HTTP_TEST_SERVER=zorba-http-test:8080 \
            -e ZORBA_PCH=$pch \
            -v "$PWD":/src -w /src zorba-builder:ci \
            sh scripts/buildtime/measure.sh "$mode"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildtime-${{ matrix.job }}
          path: out/
          if-no-files-found: warn
