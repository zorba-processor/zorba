name: Sanitizers

# Full test suite under AddressSanitizer, LeakSanitizer and UBSan (GCC, Arch
# latest-toolchain builder). Non-blocking: it reports, it does not gate PRs.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [sanitizers]

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - name: Build the HTTP test server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/http-test-server/Dockerfile
          load: true
          tags: zorba-http-test:ci
          cache-from: type=gha,scope=http-test-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=http-test-linux-amd64-latest

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-

      # LeakSanitizer needs ptrace, which Docker's default seccomp profile blocks.
      - name: Build and test under sanitizers
        run: |
          docker network create zorba-test
          docker run -d --name zorba-http-test --network zorba-test zorba-http-test:ci
          docker run --rm --network zorba-test \
            --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            -e ZORBA_HTTP_TEST_SERVER=zorba-http-test:8080 \
            -e CCACHE_DIR=/src/.ccache \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              set -e
              cmake --preset asan
              cmake --build --preset asan
              mkdir -p build/asan/sanitizer-logs
              ctest --preset asan -j"$(nproc)" --output-junit junit.xml \
                > build/asan/ctest.log 2>&1 || true
              sed -n "/tests passed/,\$p" build/asan/ctest.log
              # The sanitizer runtime writes logs as root with mode 0600;
              # hand them to the runner user so later steps can read them.
              chown -R "$HOST_UID:$HOST_GID" build/asan/sanitizer-logs \
                build/asan/ctest.log build/asan/junit.xml .ccache || true'

      - name: Summarize
        if: always()
        run: |
          # UBSan reports are only in the test output (see the script).
          python3 scripts/summarize_sanitizer_logs.py \
            build/asan/sanitizer-logs /src 60 --junit build/asan/junit.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sanitizer-logs
          path: |
            build/asan/sanitizer-logs
            build/asan/ctest.log
            build/asan/junit.xml
