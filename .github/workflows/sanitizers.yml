name: Sanitizers

# Full test suite under AddressSanitizer, LeakSanitizer and UBSan (GCC, Arch
# latest-toolchain builder), the thread-safety tests under ThreadSanitizer
# (TSan cannot be combined with ASan, so it is a separate build), and the full
# test suite under libstdc++'s debug mode with the store's checked iterators
# (glibcxx-debug: a use of an invalidated iterator fails its test).
# It does not gate PRs (it does not run on them), but a run fails when any
# test fails under the sanitizers or UBSan reports a UB site, so failures cannot
# hide behind the summary.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which sanitizer jobs to run"
        type: choice
        options: [all, asan, tsan, glibcxx-debug]
        default: all
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [sanitizers]

permissions:
  contents: read

jobs:
  asan:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'asan'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - name: Build the HTTP test server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/http-test-server/Dockerfile
          load: true
          tags: zorba-http-test:ci
          cache-from: type=gha,scope=http-test-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=http-test-linux-amd64-latest

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-asan-${{ github.sha }}
          restore-keys: ccache-v2-asan-

      # LeakSanitizer needs ptrace, which Docker's default seccomp profile blocks.
      - name: Build and test under sanitizers
        run: |
          docker network create zorba-test
          docker run -d --name zorba-http-test --network zorba-test zorba-http-test:ci
          docker run --rm --network zorba-test \
            --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            -e ZORBA_HTTP_TEST_SERVER=zorba-http-test:8080 \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              set -e
              cmake --preset asan
              cmake --build --preset asan
              mkdir -p build/asan/sanitizer-logs
              rc=0
              ctest --preset asan -j"$(nproc)" --output-junit junit.xml \
                > build/asan/ctest.log 2>&1 || rc=$?
              sed -n "/tests passed/,\$p" build/asan/ctest.log
              # The sanitizer runtime writes logs as root with mode 0600;
              # hand them to the runner user so later steps can read them.
              chown -R "$HOST_UID:$HOST_GID" build/asan/sanitizer-logs \
                build/asan/ctest.log build/asan/junit.xml .ccache || true
              exit $rc'

      - name: Summarize
        if: always()
        run: |
          # UBSan reports are only in the test output (see the script).
          python3 scripts/summarize_sanitizer_logs.py \
            build/asan/sanitizer-logs /src 60 --junit build/asan/junit.xml \
            > "$RUNNER_TEMP/asan-summary.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/asan-summary.md"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sanitizer-logs
          path: |
            build/asan/sanitizer-logs
            build/asan/ctest.log
            build/asan/junit.xml

      # UBSan runs in recover mode, so a report does not fail its test. Any
      # UB site in the summary fails the job; a summary without the count
      # fails it too. Runs after the upload so the logs are always kept.
      - name: Fail on undefined behavior
        if: always()
        run: |
          ub=$(sed -n 's/.* \([0-9][0-9]*\) UB sites .*/\1/p' "$RUNNER_TEMP/asan-summary.md" | head -n 1)
          if [ -z "$ub" ]; then
            echo "::error::No UB site count in the sanitizer summary"
            exit 1
          fi
          if [ "$ub" -ne 0 ]; then
            echo "::error::UBSan reported undefined behavior at $ub site(s); see the Summarize step"
            exit 1
          fi
          echo "UBSan: 0 UB sites"

  # ThreadSanitizer on the multithreaded tests (test/libunit/mapm_threads runs
  # concurrent decimal and integer arithmetic) plus a few existing tests, in
  # the default and the big-integer configuration.
  tsan:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'tsan'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        preset: [tsan, tsan-bigint]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-v2-${{ matrix.preset }}-

      # TSan's shadow memory layout does not fit the runner kernel's default
      # mmap ASLR entropy.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and test under ThreadSanitizer
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e PRESET \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              set -e
              cmake --preset "$PRESET"
              cmake --build --preset "$PRESET"
              mkdir -p "build/$PRESET/sanitizer-logs"
              rc=0
              ctest --preset "$PRESET" -j2 --output-junit junit.xml \
                > "build/$PRESET/ctest.log" 2>&1 || rc=$?
              sed -n "/tests passed/,\$p" "build/$PRESET/ctest.log"
              chown -R "$HOST_UID:$HOST_GID" "build/$PRESET/sanitizer-logs" \
                "build/$PRESET/ctest.log" "build/$PRESET/junit.xml" .ccache || true
              exit $rc'

      - name: Summarize
        if: always()
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          logs="build/$PRESET/sanitizer-logs"
          n=$(cat "$logs"/tsan.* 2>/dev/null | grep -c "^WARNING: ThreadSanitizer" || true)
          m=$(cat "$logs"/tsan.* 2>/dev/null | grep -c "zorbatypes/m_apm\|zorbatypes/mapm/" || true)
          {
            echo "## ThreadSanitizer ($PRESET)"
            echo "Reports: $n"
            echo "Stack frames in MAPM (src/zorbatypes/m_apm*, mapm/): $m"
            echo '```'
            cat "$logs"/tsan.* 2>/dev/null | grep "^WARNING: ThreadSanitizer\|^SUMMARY: ThreadSanitizer" \
              | sort | uniq -c | sort -rn | head -60
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Races elsewhere are reported above; races involving MAPM fail the job.
          test "$m" -eq 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tsan-logs-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/sanitizer-logs
            build/${{ matrix.preset }}/ctest.log
            build/${{ matrix.preset }}/junit.xml

  # ThreadSanitizer on zorba-mcp's background scanner (bin/mcp/scan_* tests).
  # The tests have a PASS_REGULAR_EXPRESSION, which makes ctest ignore TSan's
  # exit code, so any report in the logs fails the job here.
  tsan-mcp:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'tsan'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-tsan-${{ github.sha }}-mcp
          restore-keys: ccache-v2-tsan-

      # TSan's shadow memory layout does not fit the runner kernel's default
      # mmap ASLR entropy.
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and test under ThreadSanitizer
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              set -e
              cmake --preset tsan
              cmake --build --preset tsan
              mkdir -p build/tsan/sanitizer-logs
              rc=0
              ctest --preset tsan-mcp -j2 --output-junit junit.xml \
                > build/tsan/ctest.log 2>&1 || rc=$?
              sed -n "/tests passed/,\$p" build/tsan/ctest.log
              chown -R "$HOST_UID:$HOST_GID" build/tsan/sanitizer-logs \
                build/tsan/ctest.log build/tsan/junit.xml .ccache || true
              exit $rc'

      - name: Summarize
        if: always()
        run: |
          logs=build/tsan/sanitizer-logs
          n=$(cat "$logs"/tsan-mcp.* 2>/dev/null | grep -c "^WARNING: ThreadSanitizer" || true)
          {
            echo "## ThreadSanitizer (zorba-mcp scanner)"
            echo "Reports: $n"
            echo '```'
            cat "$logs"/tsan-mcp.* 2>/dev/null | grep "^WARNING: ThreadSanitizer\|^SUMMARY: ThreadSanitizer" \
              | sort | uniq -c | sort -rn | head -60
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "$n" -eq 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tsan-logs-mcp
          path: |
            build/tsan/sanitizer-logs
            build/tsan/ctest.log
            build/tsan/junit.xml

  # The full suite with _GLIBCXX_DEBUG (checked std containers and iterators)
  # and ZORBA_CONTAINER_CHECKS (checked PtrVector iterators in the store).
  # _GLIBCXX_DEBUG changes the layout of the std containers, so no std
  # container may cross into a library built without it: libxml2, libxslt,
  # curl, zlib and libuuid are C libraries, and the C++ ones (ICU, Xerces-C)
  # take no std container in their interfaces. A function parameter mismatch
  # would fail to link (debug containers have their own mangled names); the
  # step lists the C++ libraries and any std container in their headers, where
  # a class member would not.
  # The test preset excludes test/api/timeout_bounds: it bounds how late a
  # query timeout may fire, and debug mode's checks (linear in the container
  # size on some operations) make a timed operation miss that bound.
  glibcxx-debug:
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'glibcxx-debug'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - name: Build the HTTP test server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/http-test-server/Dockerfile
          load: true
          tags: zorba-http-test:ci
          cache-from: type=gha,scope=http-test-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=http-test-linux-amd64-latest

      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-glibcxx-debug-${{ github.sha }}
          restore-keys: ccache-v2-glibcxx-debug-

      - name: Build and test under debug mode
        run: |
          docker network create zorba-test
          docker run -d --name zorba-http-test --network zorba-test zorba-http-test:ci
          docker run --rm --network zorba-test \
            -e ZORBA_HTTP_TEST_SERVER=zorba-http-test:8080 \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              set -e
              cmake --preset glibcxx-debug
              cmake --build --preset glibcxx-debug
              out=build/glibcxx-debug/abi.txt
              {
                echo "C++ libraries that libzorba links:"
                lib=$(find build/glibcxx-debug -name "libzorba_simplestore.so*" -type f | head -n 1)
                for dep in $(ldd "$lib" | sed -n "s/.*=> \(\/[^ ]*\) .*/\1/p"); do
                  if readelf -d "$dep" | grep -q "NEEDED.*libstdc++"; then
                    echo "  $dep"
                  fi
                done
                echo "std containers in the headers of ICU and Xerces-C:"
                grep -rnE "std::(vector|deque|list|forward_list|map|multimap|set|multiset|unordered_[a-z]+|bitset)[[:space:]]*<" \
                  /usr/include/unicode /usr/local/include/xercesc || echo "  none"
              } > "$out" 2>&1
              cat "$out"
              rc=0
              ctest --preset glibcxx-debug -j"$(nproc)" --output-junit junit.xml \
                > build/glibcxx-debug/ctest.log 2>&1 || rc=$?
              sed -n "/tests passed/,\$p" build/glibcxx-debug/ctest.log
              chown -R "$HOST_UID:$HOST_GID" build/glibcxx-debug/ctest.log \
                build/glibcxx-debug/junit.xml "$out" .ccache || true
              exit $rc'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: glibcxx-debug-logs
          path: |
            build/glibcxx-debug/abi.txt
            build/glibcxx-debug/ctest.log
            build/glibcxx-debug/junit.xml
