name: theap temporary
# Temporary, for the branch timeout-heap only. Removed before the branch is
# finished. Runs test/api/timeout_bounds only, on three configurations.
on:
  push:
    branches: [timeout-heap]
permissions:
  contents: read
jobs:
  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/builder-image
        with:
          context: docker/builder-latest
          cache-scope: linux-amd64-latest
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-asan-theap-${{ github.sha }}
          restore-keys: |
            ccache-v2-asan-theap-
            ccache-v2-asan-
      - name: Build and run
        run: |
          mkdir -p .ccache out
          docker run --rm --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              cmake --preset asan > /dev/null
              cmake --build --preset asan > out/build.log 2>&1 || { tail -50 out/build.log; exit 1; }
              mkdir -p build/asan/sanitizer-logs
              ctest --preset asan -R "^test/api/timeout_bounds\$" --repeat until-fail:3 -V > out/ctest.log 2>&1
              rc=$?
              grep -E "tests passed|tests failed|^test_|full run|order by|caught" out/ctest.log | tail -40
              cp -r build/asan/sanitizer-logs out/ || true
              head -60 out/sanitizer-logs/asan* 2>/dev/null
              chmod -R a+rwX out .ccache build
              exit $rc'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theap-asan
          path: out/
  noicu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/builder-image
        with:
          context: docker/builder-latest
          cache-scope: linux-amd64-latest
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-profile-embedded-noicu-theap-${{ github.sha }}
          restore-keys: |
            ccache-v2-profile-embedded-noicu-theap-
            ccache-v2-profile-embedded-noicu-
      - name: Build and run
        run: |
          mkdir -p .ccache out
          docker run --rm \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              cmake --preset embedded-noicu > /dev/null
              cmake --build --preset embedded-noicu > out/build.log 2>&1 || { tail -50 out/build.log; exit 1; }
              rc=0
              for mode in plain check; do
                for i in 1 2 3 4 5 6; do
                  if [ $mode = check ]; then
                    export MALLOC_CHECK_=3 MALLOC_PERTURB_=165 LD_PRELOAD=libc_malloc_debug.so.0
                  fi
                  ctest --test-dir build/embedded-noicu -R "^test/api/timeout_bounds\$" -V > out/$mode-$i.log 2>&1 || rc=1
                  unset MALLOC_CHECK_ MALLOC_PERTURB_ LD_PRELOAD
                  echo "== $mode $i"
                  grep -E "tests passed|tests failed|Subprocess|corrupted|double|free\(\)|malloc|full run|order by:|caught" out/$mode-$i.log | tail -12
                done
              done
              chmod -R a+rwX out .ccache build
              exit $rc'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theap-noicu
          path: out/
  tag:
    # The released source, with the query that needs no time limit.
    if: "contains(github.event.head_commit.message, 'theap-tag')"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v5.0.0-alpha.1
      - uses: ./.github/actions/builder-image
        with:
          context: docker/builder-latest
          cache-scope: linux-amd64-latest
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v2-asan-theap-tag-${{ github.sha }}
          restore-keys: |
            ccache-v2-asan-theap-tag-
            ccache-v2-asan-
      - name: Build and run
        run: |
          mkdir -p .ccache out
          cat > out/q.xq <<'XQ'
          declare variable $m external := 56;
          for $i in 1 to $m
          let $k := if ($i le 14) then $i
                    else if ($i le 21) then number(concat('n', $i))
                    else concat('s', $i)
          stable order by $k empty least
          return $i
          XQ
          docker run --rm --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            -e CCACHE_DIR=/src/.ccache \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros -e CCACHE_DEPEND=1 \
            -v "$PWD":/src -w /src zorba-builder:ci sh -c '
              cmake --preset asan > /dev/null
              cmake --build --preset asan --target zorbacmd > out/build.log 2>&1 || { tail -50 out/build.log; exit 1; }
              ASAN_OPTIONS=detect_leaks=0 build/asan/bin/zorba -f -q out/q.xq > out/run.log 2>&1
              rc=$?
              echo "exit $rc"
              head -60 out/run.log
              chmod -R a+rwX out .ccache build
              exit 0'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theap-tag
          path: out/
