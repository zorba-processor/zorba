name: Benchmarks

# Query-performance benchmark (XMark + JSONiq). Measures only.
# With ref_b set, both refs are built and measured in the SAME job so that
# runner noise affects both sides equally; the report gives the ratio B/A.
on:
  workflow_dispatch:
    inputs:
      ref_a:
        description: "Ref (branch/tag/SHA) to measure; default: the ref the workflow runs on"
        required: false
        default: ""
      ref_b:
        description: "Optional second ref to compare against A (reports B/A)"
        required: false
        default: ""
      runs:
        description: "Timed runs per query (after 1 warm-up)"
        required: false
        default: "5"
      timeout:
        description: "Per-query timeout in seconds"
        required: false
        default: "300"
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [bench]   # temporary: baseline run while the suite is being developed

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      REF_A: ${{ inputs.ref_a || github.sha }}
      REF_B: ${{ inputs.ref_b }}
      RUNS: ${{ inputs.runs || '5' }}
      QUERY_TIMEOUT: ${{ inputs.timeout || '300' }}
    steps:
      # The harness (bench/) always comes from the ref the workflow runs on,
      # so A and B are measured with identical queries.
      - uses: actions/checkout@v4

      - name: Restore benchmark data
        id: data
        uses: actions/cache/restore@v4
        with:
          path: bench-data
          key: bench-data-${{ hashFiles('bench/gen_json.py', 'bench/gen_data.sh', 'bench/xmlgen.sha256') }}

      - name: Generate benchmark data
        run: bench/gen_data.sh bench-data

      - name: Save benchmark data
        if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bench-data
          key: bench-data-${{ hashFiles('bench/gen_json.py', 'bench/gen_data.sh', 'bench/xmlgen.sha256') }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF_A }}
          path: src-a

      - uses: actions/checkout@v4
        if: env.REF_B != ''
        with:
          ref: ${{ env.REF_B }}
          path: src-b

      - uses: docker/setup-buildx-action@v3

      # Same scope as ci.yml so the image comes from the shared cache.
      - name: Build the builder image
        uses: docker/build-push-action@v6
        with:
          context: docker/builder-latest
          load: true
          tags: zorba-builder:ci
          cache-from: type=gha,scope=builder-linux-amd64-latest
          cache-to: type=gha,mode=max,scope=builder-linux-amd64-latest

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-amd64-latest-bench-${{ github.run_id }}
          restore-keys: ccache-linux-amd64-latest-

      - name: Build and measure A
        run: |
          mkdir -p out .ccache
          bench/bench-ref.sh src-a "$REF_A" a

      - name: Build and measure B
        if: env.REF_B != ''
        run: bench/bench-ref.sh src-b "$REF_B" b

      - name: Compare
        if: env.REF_B != ''
        run: |
          python3 -I bench/run.py compare out/a.json out/b.json --md out/compare.md
          cat out/compare.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: out/
