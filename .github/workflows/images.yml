name: Images

# Publishes to GHCR from master (tag plan: docker/README.md):
#   ghcr.io/<owner>/zorba          command-line image (amd64 + arm64), :edge and :sha-<short>
#   ghcr.io/<owner>/zorba-builder  build environments (:latest-toolchain, :ubuntu-24.04)
# Release tags (v*) are published by release.yml; master never moves :latest.
# Master pushes publish only when code or image inputs change (a superset of
# the `code` filter of ci.yml); docs-only pushes are skipped. This workflow
# has no tag trigger, so `paths` cannot filter tag pushes; workflow_dispatch
# is never filtered.
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'modules/**'
      - 'bin/**'
      - 'test/**'
      - 'schemas/**'
      - 'cmake/**'
      - 'docker/**'
      - '.clusterfuzzlite/**'
      - '.github/codeql/**'
      - 'CMakeLists.txt'
      - 'CMake*.txt'
      - 'CMake*.json'
      - '*.cmake'
      - '*.cmake.in'
      - 'CTest*'
      - 'CPack*'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/zorba

jobs:
  builders:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - context: docker/builder-latest
            tag: latest-toolchain
            platforms: linux/amd64
            runner: ubuntu-24.04
            suffix: ''
          - context: docker/builder
            tag: ubuntu-24.04
            platforms: linux/amd64
            runner: ubuntu-24.04
            suffix: ''
          # Native arm64 build; only the content-hash tag is published.
          - context: docker/builder
            tag: ''
            platforms: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: -arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ci.yml pulls df-<hash of the Dockerfile> (see
      # .github/actions/builder-image) and builds locally when it is missing.
      - id: tags
        env:
          CONTEXT: ${{ matrix.context }}
          SUFFIX: ${{ matrix.suffix }}
          TAG: ${{ matrix.tag }}
        run: |
          hash=$(sha256sum "$CONTEXT/Dockerfile" | cut -c1-16)
          {
            echo 'list<<EOF'
            echo "${IMAGE}-builder:df-${hash}${SUFFIX}"
            [ -n "$TAG" ] && echo "${IMAGE}-builder:${TAG}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=publish-builder-${{ matrix.platforms }}-${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=publish-builder-${{ matrix.platforms }}-${{ matrix.context }}

  # Each architecture builds natively (no QEMU); the manifest is merged below.
  runtime:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runtime-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.runner }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  runtime-manifest:
    needs: runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
          flavor: latest=false
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
