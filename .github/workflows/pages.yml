name: Pages

# Verifies every example of the documentation site (site/) against the Zorba
# runtime image and, on master, deploys the site to GitHub Pages.
#
# Record mode (writes actual outputs to the "example-outputs" artifact without
# failing) is enabled by the workflow_dispatch input `record`, or by putting
# "[record]" in the head commit message of a push.
on:
  push:
    branches: [master, site]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      record:
        description: 'Record actual outputs instead of failing on mismatch'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/zorba:latest

jobs:
  examples:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.record) || contains(github.event.head_commit.message, '[record]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the runtime image
        id: pull
        continue-on-error: true
        run: docker pull "$IMAGE"

      - uses: docker/setup-buildx-action@v3
        if: steps.pull.outcome != 'success'

      - name: Build the runtime image (pull failed)
        if: steps.pull.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=runtime-ubuntu-24.04
          cache-to: type=gha,mode=max,scope=pages-runtime

      - name: Run the examples
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/site/examples":/examples:ro \
            -v "$PWD/scripts/site":/scripts:ro \
            -v "$RUNNER_TEMP/actual":/actual \
            "$IMAGE" /scripts/run_examples.sh /examples /actual
          docker run --rm --entrypoint sh \
            -v "$PWD/site/examples":/examples:ro \
            -v "$PWD/scripts/site":/scripts:ro \
            -v "$RUNNER_TEMP/actual":/actual \
            "$IMAGE" /scripts/run_cpp_examples.sh /examples /actual
          docker run --rm --entrypoint zorba "$IMAGE" --version \
            > "$RUNNER_TEMP/actual/zorba-version.txt" 2>&1 || true

      - name: Upload actual outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-outputs
          path: ${{ runner.temp }}/actual

      - name: Compare with expected outputs
        run: |
          python3 scripts/site/check_examples.py site/examples \
            "$RUNNER_TEMP/actual" $([ "$RECORD" = true ] && echo --record)

      - name: Build the site
        run: python3 scripts/site/build.py site _site $([ "$RECORD" = true ] || echo --strict)

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master' && env.RECORD != 'true'
        with:
          path: _site

  deploy:
    needs: examples
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[record]') && !(github.event_name == 'workflow_dispatch' && inputs.record)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
