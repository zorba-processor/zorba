name: Builder image
description: >
  Provide the image zorba-builder:ci. Pull the one published to GHCR by
  images.yml for the exact content of the Dockerfile (tag df-<hash>); build it
  locally when there is none, i.e. when the Dockerfile changed in this PR.
inputs:
  context:
    description: Build context directory containing the Dockerfile
    required: true
  suffix:
    description: Tag suffix of the platform ("-arm64" on arm64 runners, else empty)
    default: ''
  cache-scope:
    description: GHA build cache scope used when the image has to be built
    required: true
runs:
  using: composite
  steps:
    - id: pull
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        SUFFIX: ${{ inputs.suffix }}
      run: |
        hash=$(sha256sum "$CONTEXT/Dockerfile" | cut -c1-16)
        ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zorba-builder:df-${hash}${SUFFIX}"
        if docker pull -q "$ref"; then
          docker tag "$ref" zorba-builder:ci
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "builder image: pulled $ref"
        else
          echo "builder image: $ref not published, building locally"
        fi
    - uses: docker/setup-buildx-action@v4
      if: steps.pull.outputs.hit != 'true'
    - uses: docker/build-push-action@v7
      if: steps.pull.outputs.hit != 'true'
      with:
        context: ${{ inputs.context }}
        load: true
        tags: zorba-builder:ci
        cache-from: type=gha,scope=builder-${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=builder-${{ inputs.cache-scope }}
