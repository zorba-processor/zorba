# Apache 2.4 configuration for the http-client test server (test/http-test-data).
AddDefaultCharset UTF-8
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/docroot
    TraceEnable On

    <Directory /var/www/docroot>
        Require all granted
    </Directory>

    <Directory /var/www/docroot/http-test-data/basic-auth>
        AuthType Basic
        AuthName "Password Required"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/http-test-data.htpasswd
        Require valid-user
    </Directory>

    <Directory /var/www/cgi-bin>
        Require all granted
        Options +ExecCGI
    </Directory>

    ScriptAlias /cgi-bin/ /var/www/cgi-bin/
</VirtualHost>
